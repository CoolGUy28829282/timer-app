<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown to September 10</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .countdown {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin: 30px 0;
        }

        .time-unit {
            background: #f3f4f6;
            border-radius: 12px;
            padding: 20px;
            border: 2px solid #667eea;
        }

        .time-value {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            font-family: 'Courier New', monospace;
        }

        .time-label {
            font-size: 14px;
            color: #666;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .finished {
            font-size: 48px;
            color: #10b981;
            font-weight: bold;
            margin: 30px 0;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .time-value {
                font-size: 36px;
            }

            .countdown {
                gap: 10px;
            }

            .time-unit {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏱️ Countdown</h1>
        <p class="subtitle">Time until September 10th, 2026 (MST)</p>
        
        <div id="countdown" class="countdown">
            <div class="time-unit">
                <div class="time-value" id="days">00</div>
                <div class="time-label">Days</div>
            </div>
            <div class="time-unit">
                <div class="time-value" id="hours">00</div>
                <div class="time-label">Hours</div>
            </div>
            <div class="time-unit">
                <div class="time-value" id="minutes">00</div>
                <div class="time-label">Minutes</div>
            </div>
            <div class="time-unit">
                <div class="time-value" id="seconds">00</div>
                <div class="time-label">Seconds</div>
            </div>
        </div>

        <div id="finished" class="finished" style="display: none;">
            🎉 September 10th is here! 🎉
        </div>
    </div>

    <script>
        function updateCountdown() {
            // Create target date: September 10, 2026 at midnight MST
            // MST is UTC-7
            const targetDate = new Date('2026-09-10T00:00:00').getTime();
            
            // Adjust for MST timezone (UTC-7)
            // Get current time in UTC
            const now = new Date();
            const utcTime = now.getTime();
            
            // MST is UTC-7, so we need to get the current time in MST
            const mstTime = new Date(utcTime - (now.getTimezoneOffset() * 60000));
            
            // Get today's date at midnight MST
            const currentMST = new Date(mstTime.getFullYear(), mstTime.getMonth(), mstTime.getDate());
            const targetDateMST = new Date(2026, 8, 10); // September is month 8 (0-indexed)
            
            const timeRemaining = targetDateMST.getTime() - currentMST.getTime();

            if (timeRemaining <= 0) {
                document.getElementById('countdown').style.display = 'none';
                document.getElementById('finished').style.display = 'block';
                return;
            }

            const days = Math.floor(timeRemaining / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeRemaining % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeRemaining % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeRemaining % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        // Update immediately and then every second
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
