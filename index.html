<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 32px;
        }

        .timer-display {
            font-size: 72px;
            font-weight: bold;
            color: #667eea;
            margin: 30px 0;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        input {
            width: 80px;
            padding: 10px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 8px;
            text-align: center;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-start {
            background: #667eea;
            color: white;
        }

        .btn-start:hover {
            background: #5568d3;
            transform: scale(1.05);
        }

        .btn-pause {
            background: #f59e0b;
            color: white;
        }

        .btn-pause:hover {
            background: #d97706;
            transform: scale(1.05);
        }

        .btn-reset {
            background: #ef4444;
            color: white;
        }

        .btn-reset:hover {
            background: #dc2626;
            transform: scale(1.05);
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }

            .timer-display {
                font-size: 48px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏱️ Timer</h1>
        
        <div class="input-group">
            <input type="number" id="minutes" placeholder="MM" min="0" max="59" value="1">
            <span style="font-size: 24px; color: #667eea;">:</span>
            <input type="number" id="seconds" placeholder="SS" min="0" max="59" value="0">
        </div>

        <div class="timer-display" id="display">01:00</div>

        <div class="button-group">
            <button class="btn-start" onclick="startTimer()">Start</button>
            <button class="btn-pause" onclick="pauseTimer()">Pause</button>
            <button class="btn-reset" onclick="resetTimer()">Reset</button>
        </div>
    </div>

    <script>
        let timeLeft = 60;
        let isRunning = false;
        let intervalId = null;

        const display = document.getElementById('display');
        const minutesInput = document.getElementById('minutes');
        const secondsInput = document.getElementById('seconds');

        function updateDisplay() {
            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            display.textContent = 
                String(mins).padStart(2, '0') + ':' + 
                String(secs).padStart(2, '0');
        }

        function startTimer() {
            if (isRunning) return;
            
            if (!isRunning && timeLeft === 0) {
                timeLeft = parseInt(minutesInput.value || 0) * 60 + 
                          parseInt(secondsInput.value || 0);
            }
            
            if (timeLeft <= 0) {
                timeLeft = parseInt(minutesInput.value || 0) * 60 + 
                          parseInt(secondsInput.value || 0);
            }

            isRunning = true;
            minutesInput.disabled = true;
            secondsInput.disabled = true;

            intervalId = setInterval(() => {
                timeLeft--;
                updateDisplay();

                if (timeLeft === 0) {
                    clearInterval(intervalId);
                    isRunning = false;
                    playSound();
                    minutesInput.disabled = false;
                    secondsInput.disabled = false;
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(intervalId);
            minutesInput.disabled = false;
            secondsInput.disabled = false;
        }

        function resetTimer() {
            isRunning = false;
            clearInterval(intervalId);
            timeLeft = parseInt(minutesInput.value || 0) * 60 + 
                      parseInt(secondsInput.value || 0);
            updateDisplay();
            minutesInput.disabled = false;
            secondsInput.disabled = false;
        }

        function playSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gain = audioContext.createGain();

            oscillator.connect(gain);
            gain.connect(audioContext.destination);

            oscillator.frequency.value = 800;
            oscillator.type = 'sine';

            gain.gain.setValueAtTime(0.3, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.5);

            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.5);
        }

        // Initialize display
        updateDisplay();

        // Update display when inputs change
        minutesInput.addEventListener('change', updateDisplay);
        secondsInput.addEventListener('change', updateDisplay);
    </script>
</body>
</html>
